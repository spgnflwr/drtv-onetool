<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DRTV 원툴</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F3; --panel:#FFFFFF; --ink:#17201C; --sub:#59655F; --line:#D5DCD8; --soft:#E7ECE9; --rail:#18302D; --rail-ink:#CFE3DF; --rail-on:#FFFFFF;
  --pri:#1F5F5B; --pri-ink:#FFFFFF; --pri-soft:#DCEBE9; --err:#B3362C; --err-soft:#F7E3E0; --warn:#946500; --warn-soft:#FAF0D6; --ok:#2E7D4F; --ok-soft:#DFF0E5;
  --h0:#EEF3F1; --h1:#C9E0DB; --h2:#93C2BA; --h3:#4F9A8F; --h4:#1F5F5B;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111614; --panel:#19201D; --ink:#E5ECE8; --sub:#98A69F; --line:#2D3632; --soft:#222A26; --rail:#0C1412; --rail-ink:#9FB9B3; --rail-on:#FFFFFF;
  --pri:#5FB3AC; --pri-ink:#0E1513; --pri-soft:#1E3431; --err:#F08A80; --err-soft:#3A2220; --warn:#E3B54A; --warn-soft:#3A3120; --ok:#6FCF97; --ok-soft:#1D3326;
  --h0:#1E2623; --h1:#1F3D39; --h2:#2B6A62; --h3:#3F978C; --h4:#7FD1C6; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#111614; --panel:#19201D; --ink:#E5ECE8; --sub:#98A69F; --line:#2D3632; --soft:#222A26; --rail:#0C1412; --rail-ink:#9FB9B3; --rail-on:#FFFFFF;
  --pri:#5FB3AC; --pri-ink:#0E1513; --pri-soft:#1E3431; --err:#F08A80; --err-soft:#3A2220; --warn:#E3B54A; --warn-soft:#3A3120; --ok:#6FCF97; --ok-soft:#1D3326;
  --h0:#1E2623; --h1:#1F3D39; --h2:#2B6A62; --h3:#3F978C; --h4:#7FD1C6; color-scheme:dark; }
*{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:14px;line-height:1.55}
.app{display:grid;grid-template-columns:212px 1fr;min-height:100%}
.app>div{min-width:0}
.rail{background:var(--rail);color:var(--rail-ink);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.rail .brandmark{color:var(--rail-on);font-weight:700;font-size:16px;padding:2px 10px 2px}
.rail .tag{font-size:11.5px;padding:0 10px 16px;opacity:.8}
.rail nav button{display:block;width:100%;text-align:left;background:none;border:none;color:inherit;padding:9px 10px;border-radius:7px;font:inherit;cursor:pointer}
.rail nav button:hover{background:rgba(255,255,255,.06)}
.rail nav button.on{background:rgba(255,255,255,.12);color:var(--rail-on);font-weight:600}
.rail .grp{font-size:11.5px;opacity:.65;padding:14px 10px 4px}
.rail .store{font-size:11.5px;margin-top:18px;padding:10px;border-top:1px solid rgba(255,255,255,.1);opacity:.85}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.top h1{font-size:18px;margin:0;margin-right:auto;font-weight:700}
.top label{font-size:12px;color:var(--sub);display:flex;gap:6px;align-items:center}
select,input[type=text],input[type=number]{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
.content{padding:22px 24px 60px;max-width:1680px}
@media (max-width:860px){.app{grid-template-columns:1fr}.rail{position:static;height:auto;display:flex;gap:6px;overflow-x:auto;padding:10px}.rail .brandmark,.rail .tag,.rail .grp,.rail .store{display:none}.rail nav{display:flex;gap:4px}.rail nav button{white-space:nowrap}.content,.top{padding-left:14px;padding-right:14px}}
button{font:inherit;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;cursor:pointer}
button.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);font-weight:600}
button.sm{padding:3px 9px;font-size:12px}
button.danger{color:var(--err)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 4px}
.card .lead{color:var(--sub);margin:0 0 14px;font-size:13px;max-width:78ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:980px){.grid2,.grid3{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
.kpi{background:var(--panel);padding:12px 14px}
.kpi div{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--sub)}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:520px}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:6px 9px;border-bottom:1px solid var(--soft);text-align:left;white-space:nowrap}
th{background:var(--soft);font-weight:600;position:sticky;top:0;z-index:1}
td.n,th.n{text-align:right}
tr.bad td{background:var(--err-soft)}
td input{width:100%;min-width:70px;border:1px solid transparent;background:transparent;padding:3px 5px;border-radius:4px;font:inherit;color:var(--ink)}
td input:hover{border-color:var(--line)} td input:focus{border-color:var(--pri);background:var(--panel)}
tr.dirty td{background:var(--warn-soft)}
.drop{display:block;border:1px dashed var(--line);border-radius:8px;padding:12px;cursor:pointer;background:var(--bg)}
.drop:hover,.drop.over{border-color:var(--pri)}
.drop b{display:block}
.drop small{color:var(--sub)}
.drop input{display:none}
.wl{list-style:none;margin:0;padding:0}
.wl li{padding:7px 10px;border-radius:6px;margin-bottom:5px;font-size:13px;display:flex;gap:10px}
.wl li em{font-style:normal;font-weight:600;min-width:90px}
.wl .error{background:var(--err-soft)} .wl .error em{color:var(--err)}
.wl .warn{background:var(--warn-soft)} .wl .warn em{color:var(--warn)}
.wl .info{background:var(--soft)} .wl .info em{color:var(--sub)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.no{background:var(--soft);color:var(--sub)} .pill.err{background:var(--err-soft);color:var(--err)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 10px;color:var(--sub)}
.tabs button.on{border-bottom-color:var(--pri);color:var(--ink);font-weight:600}
.note{font-size:12px;color:var(--sub)}
.toast{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:10px 14px;border-radius:8px;font-size:13px;max-width:420px;z-index:50;opacity:0;transform:translateY(8px);transition:.2s}
.toast.on{opacity:1;transform:none}
.status-grid{display:grid;grid-template-columns:1.2fr repeat(7,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.status-grid>div{padding:10px 12px;border-bottom:1px solid var(--soft);background:var(--panel);font-size:13px}
.status-grid .h{background:var(--soft);font-weight:600;font-size:12px}
@media (max-width:760px){.status-grid{grid-template-columns:1fr 1fr}}
.heat{border-collapse:separate;border-spacing:2px;font-size:11px}
.heat td,.heat th{padding:0;border:none;text-align:center;white-space:nowrap}
.heat th{background:none;font-weight:500;color:var(--sub);position:static}
.heat td.c{width:22px;height:20px;border-radius:3px;font-size:10px;color:var(--ink)}
.heat td.lbl{text-align:right;padding-right:8px;font-size:12px;color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:3px;height:150px;border-bottom:1px solid var(--line);padding-top:8px}
.bars div{flex:1;background:var(--h3);border-radius:3px 3px 0 0;position:relative;min-width:6px}
.bars div:hover{background:var(--h4)}
.barlbl{display:flex;gap:3px;font-size:10.5px;color:var(--sub)}
.barlbl span{flex:1;text-align:center;min-width:6px}
.hbar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden;min-width:90px}
.hbar i{display:block;height:100%;background:var(--pri)}
.hbar i.over{background:var(--err)}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;min-width:160px;background:var(--soft)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.empty{color:var(--sub);padding:28px 8px;text-align:center}
.arch{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.arch .box{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--bg)}
.arch .box b{display:block;margin-bottom:4px}
.arch .box ul{margin:0;padding-left:16px;font-size:12.5px;color:var(--sub)}
.arch .lane{grid-column:1/-1;font-size:12px;color:var(--sub);margin-top:6px}
@media (max-width:900px){.arch{grid-template-columns:1fr 1fr}}
.prose p,.prose li{max-width:80ch}
.prose h3{font-size:14px;margin:16px 0 6px}
.hide{display:none!important}
code{font-size:12px;background:var(--soft);padding:1px 5px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brandmark">DRTV 원툴</div>
    <div class="tag">DRTV 원툴 v1.5</div>
    <nav id="nav">
      <div class="grp">시작</div>
      <button data-v="brands">브랜드 설정</button>
      <div class="grp">운영</div>
      <button data-v="home" class="on">월간 현황</button>
      <button data-v="convert">큐시트 변환</button>
      <button data-v="versions">큐시트 DB</button>
      <button data-v="facts">플랜·실송출 DB</button>
      <button data-v="dash">큐시트 대시보드</button>
      <button data-v="export">납품 파일</button>
      <button data-v="actual">실송출 비교</button>
      <div class="grp">기준 정보</div>
      <button data-v="dim">디멘션</button>
      <button data-v="map">매핑 관리</button>
      <div class="grp">설계</div>
      <button data-v="arch">구조 제안</button>
    </nav>
    <div class="store" id="storeInfo">저장소 확인 중</div>
  </aside>
  <div>
    <div class="top">
      <h1 id="vtitle">월간 현황</h1>
      <label>브랜드 <select id="gBrand"></select></label>
      <label>작업월 <select id="gYm"></select></label>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="firebase-config.js"></script>
<script>
/* DRTV 큐시트 변환 엔진 v1 (브라우저/노드 공용)
   원본 로직: #01_Planned Media(Sheet2).ipynb 를 그대로 옮기고, 아래 2가지만 보정 옵션으로 둠
   - fixMultiSpot: 한 행 횟수가 일자 수의 배수면 일자당 그만큼 행 생성 (노트북은 무조건 1)
   - tokenMonth : 비고의 "11/3" 처럼 월이 적힌 토큰은 그 월을 사용 (노트북은 집행기간의 월)
*/
(function (root) {
  const OUT_COLS = ['Date','Time','Spot Type','Programme','Clock-number','Tel-No','Channel',
    'Creative','Dur','Ask','CTA','SMS Keyword','VO Artist','SPOT','Media Cost',
    'Media Cost 15%','Total Cost inc DTV fee','Audience\u00a0Rating','Impacts',
    '4059F Audience Rating','4059F Impacts','구분','Matched Tel-No'];
  const DOW = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];

  const isBlank = v => v === null || v === undefined || (typeof v === 'string' && v.trim() === '') || (typeof v === 'number' && isNaN(v));
  const s = v => (isBlank(v) ? '' : String(v));
  function toNum(v) {
    if (isBlank(v)) return 0;
    if (typeof v === 'number') return v;
    const n = Number(String(v).replace(/,/g, '').trim());
    return isNaN(n) ? 0 : n;
  }
  function mapVal(m, v) {           // pandas .replace(dict): 정확히 일치할 때만 치환
    if (m.has(v)) return m.get(v);
    const t = typeof v === 'string' ? v.trim() : v;
    if (m.has(t)) return m.get(t);
    return v;
  }
  function normalizeTime(v) {
    if (isBlank(v)) return null;
    if (typeof v === 'number') {
      if (v >= 0 && v < 1) {
        const sec = Math.floor(v * 86400 + 1e-6);
        const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
        return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
      }
      return null;
    }
    const t = String(v).trim();
    return t.includes(':') ? t.slice(0, 5) : null;
  }
  const pad2 = n => String(n).padStart(2, '0');
  const ymd = d => d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
  function mkDate(y, m, d) {
    const dt = new Date(Date.UTC(y, m - 1, d));
    if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return null;
    return dt;
  }

  // 비고(방송일) 해석 규칙 (약속된 표기: "11/3,10,17" — 첫 날짜에 월 표기, 쉼표 구분)
  // 정상 처리: 띄어쓰기 제거("11/3, 10" → "11/3,10"), "11월3일" 같은 날짜 표기 → "11/3", 엑셀 날짜값
  // 오류: 비고 빈칸, 첫 날짜에 월 없음("3,10"), 기간("11/3~7"), 요일·괄호 등 약속과 다른 표기, 없는 날짜("11/31")
  function parseDays(raw, y, pm, tokenMonth) {
    const out = { dates: [], bad: [], blank: false, why: '' };
    if (isBlank(raw)) { out.blank = true; return out; }
    if (typeof raw === 'number' && raw > 20000) { out.dates.push(new Date(Date.UTC(1899, 11, 30) + Math.round(raw) * 864e5)); return out; }
    const orig = s(raw);
    let str = orig.replace(/[ \t\u00a0]/g, '').replace(/(\d{1,2})월(\d{1,2})일?/g, '$1/$2').replace(/(\d{1,2})일/g, '$1');
    const toks = str.split(',');
    if (!toks.length || toks.some(t => !/^(\d{1,2}\/)?\d{1,2}$/.test(t))) { out.bad.push(orig); out.why = /~|-/.test(str) ? '기간 표기(~)는 약속된 형식이 아님' : /[()（）]/.test(str) ? '괄호·요일 표기는 약속된 형식이 아님' : '약속된 형식(11/3,10,17)이 아님'; return out; }
    if (!toks[0].includes('/')) { out.bad.push(orig); out.why = '첫 날짜에 월 표기가 없음 (예: 11/3,10)'; return out; }
    let curM = pm; const dates = [];
    for (const tk of toks) {
      const parts = tk.split('/');
      if (parts.length === 2) curM = tokenMonth ? +parts[0] : pm;
      const dt = y && curM ? mkDate(y, curM, +parts[parts.length - 1]) : null;
      if (!dt) { out.bad.push(orig); out.why = `없는 날짜 (${tk})`; return out; }
      dates.push(dt);
    }
    out.dates = dates; return out;
  }

  /* ---------- 표 읽기 도우미 ---------- */
  function sheetRows(XLSX, ws) { return XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null }); }
  function tableFrom(rows, hdrIdx) {
    const hdr = rows[hdrIdx].map(h => s(h).trim());
    return rows.slice(hdrIdx + 1).map(r => { const o = {}; hdr.forEach((h, i) => { if (h && !(h in o)) o[h] = r[i]; }); return o; });
  }
  function readTable(XLSX, wb, name) {
    const ws = wb.Sheets[name]; if (!ws) return null;
    const rows = sheetRows(XLSX, ws); if (!rows.length) return [];
    return tableFrom(rows, 0).filter(o => Object.values(o).some(v => !isBlank(v)));
  }

  /* ---------- 디멘션 ---------- */
  function loadDimension(XLSX, wb) {
    const need = ['channel', 'cre', 'clockmatrix', 'mediaplan'];
    const miss = need.filter(n => !wb.Sheets[n]);
    if (miss.length) throw new Error('디멘션 파일에 시트가 없습니다: ' + miss.join(', '));
    const channel = readTable(XLSX, wb, 'channel');
    const cre = readTable(XLSX, wb, 'cre');
    const dtv = readTable(XLSX, wb, 'dtv_cre') || [];
    return {
      channel: channel.filter(r => !isBlank(r['방송사'])).map(r => ({ from: s(r['방송사']), to: s(r['Channel']) })),
      cre: cre.filter(r => !isBlank(r['CopyLine'])).map(r => ({ from: s(r['CopyLine']), to: s(r['Creative Name']) })),
      dtvCre: dtv.filter(r => !isBlank(r['Creative Name'])).map(r => ({ from: s(r['Creative Name']), to: s(r['DTV Creative']) })),
      clockmatrix: readTable(XLSX, wb, 'clockmatrix'),
      mediaplan: readTable(XLSX, wb, 'mediaplan'),
      hasDtvSheet: !!wb.Sheets['dtv_cre'],
    };
  }
  function buildMap(pairs) { const m = new Map(); pairs.forEach(p => { if (!m.has(p.from)) m.set(p.from, p.to); }); return m; }

  /* ---------- 매체사 큐시트 ---------- */
  function findLabel(rows, label) {
    for (const r of rows.slice(0, 15)) if (s(r[0]).replace(/\s/g, '') === label) return r[1];
    return null;
  }
  function parseCuesheet(XLSX, wb) {
    const tv = [], ip = [], skipped = [];
    wb.SheetNames.forEach(name => {
      const rows = sheetRows(XLSX, wb.Sheets[name]);
      let hi = -1;
      for (let i = 0; i < Math.min(rows.length, 40); i++) {
        const r = rows[i].map(x => s(x).trim());
        if (r.includes('프로그램') && r.includes('시작')) { hi = i; break; }
        if (r.includes('밴더') && r.includes('광고비')) { hi = -2 - i; break; }
      }
      const meta = {
        sheet: name,
        channel: s(findLabel(rows, '채널명')).trim(),
        advertiser: s(findLabel(rows, '광고주명')),
        product: s(findLabel(rows, '브랜드명')),
        budget: toNum(findLabel(rows, '청약금액(VAT별도)')),
        period: s(findLabel(rows, '집행기간')).trim(),
        bonusPct: toNum(findLabel(rows, '보너스율')),
        spotsDeclared: toNum(findLabel(rows, '송출횟수')),
        mediaValue: toNum(findLabel(rows, '미디어밸류')),
      };
      if (hi >= 0) {
        const all = tableFrom(rows, hi); let last = '';
        all.forEach(o => { const v = s(o['채널']).trim(); if (v) last = v; o._station = last || meta.channel; });
        const recs = all.filter(o => !isBlank(o['시작']));
        tv.push({ ...meta, rows: recs });

async function diffVersions(a, b) {
  if (a.uploadedAt > b.uploadedAt) [a, b] = [b, a];
  const [ra, rb] = await Promise.all([loadSpots(a), loadSpots(b)]);
  const key = o => [DRTV.ymd(o.Date), o.Time, o.Channel, o.Programme, o['Spot Type'], o._creativeDetail].join('|');
  const ca = new Map(), cb = new Map(); ra.forEach(o => ca.set(key(o), (ca.get(key(o)) || 0) + 1)); rb.forEach(o => cb.set(key(o), (cb.get(key(o)) || 0) + 1));
  const added = [], removed = [];
  new Set([...ca.keys(), ...cb.keys()]).forEach(k => { const d = (cb.get(k) || 0) - (ca.get(k) || 0); if (d > 0) added.push([k, d]); if (d < 0) removed.push([k, -d]); });
  const chs = [...new Set([...Object.keys(a.byCh), ...Object.keys(b.byCh)])].sort();
  const line = ([k, n]) => { const p = k.split('|'); return `<tr><td>${p[0]}</td><td>${p[1]}</td><td>${esc(p[2])}</td><td>${esc(p[3])}</td><td>${esc(p[4])}</td><td>${esc(p[5])}</td><td class="n">${n}</td></tr>`; };
  const th = '<thead><tr><th>날짜</th><th>시간</th><th>채널</th><th>프로그램</th><th>형태</th><th>소재</th><th class="n">스팟</th></tr></thead>';
  $('#vDiff').innerHTML = `<div class="card"><h2>${a.ym} v${a.version} → v${b.version} 변경</h2><p class="lead">스팟 키는 날짜, 시간, 채널, 프로그램, 형태, 소재입니다. 추가 ${added.reduce((s, x) => s + x[1], 0)}스팟, 삭제 ${removed.reduce((s, x) => s + x[1], 0)}스팟.</p>
   <div class="tbl" style="margin-bottom:12px"><table><thead><tr><th>채널</th><th class="n">스팟 v${a.version}</th><th class="n">스팟 v${b.version}</th><th class="n">차이</th><th class="n">Cost 15% v${a.version}</th><th class="n">Cost 15% v${b.version}</th><th class="n">차이</th></tr></thead><tbody>${chs.map(c => { const x = a.byCh[c] || { spots: 0, c15: 0 }, y = b.byCh[c] || { spots: 0, c15: 0 }; return `<tr class="${x.spots !== y.spots || Math.abs(x.c15 - y.c15) > 1 ? 'bad' : ''}"><td>${esc(c)}</td><td class="n">${x.spots}</td><td class="n">${y.spots}</td><td class="n">${y.spots - x.spots}</td><td class="n">${fmt(x.c15)}</td><td class="n">${fmt(y.c15)}</td><td class="n">${fmt(y.c15 - x.c15)}</td></tr>`; }).join('')}</tbody></table></div>
   <div class="grid2"><div><b>추가된 스팟</b><div class="tbl"><table>${th}<tbody>${added.slice(0, 300).map(line).join('') || '<tr><td colspan="7" class="empty">없음</td></tr>'}</tbody></table></div></div><div><b>빠진 스팟</b><div class="tbl"><table>${th}<tbody>${removed.slice(0, 300).map(line).join('') || '<tr><td colspan="7" class="empty">없음</td></tr>'}</tbody></table></div></div></div></div>`;
}

/* ================= 대시보드: 채널 상세 (프로그램·시간대·소재) ================= */
let dashSt = '', dashVer = '', dashCre = '', dashCh = '', dashSort = 'time', dashFrom = 1, dashWin = 'fit', dashShowCost = true;
function renderChDetail(rows, chs, days, ymd) {

  if (dashSt && !stList.includes(dashSt)) dashSt = '';
  const sel = dashSt ? sel0.filter(o => o._station === dashSt) : sel0;
  const g = new Map();
  sel.forEach(o => {
    const k = [all ? o.Channel : '', stList.length > 1 ? o._station : '', o.Time, o.Programme, o['Spot Type'], o._creativeDetail, o['Clock-number'], Math.round(o['Media Cost 15%'] || 0)].join('\u0001');
    const v = g.get(k) || { o, n: new Array(days + 1).fill(0), cnt: 0, imp: 0, c15: 0 };
    v.n[o.Date.getUTCDate()]++; v.cnt++; v.imp += +o.Impacts || 0; v.c15 += o['Media Cost 15%'] || 0; g.set(k, v);
  });
  const cmp = (a, b) => String(a ?? '').localeCompare(String(b ?? ''), 'ko');
  const groups = [...g.values()].sort((a, b) => (all ? cmp(a.o.Channel, b.o.Channel) : 0) || (dashSort === 'prog' ? cmp(a.o.Programme, b.o.Programme) || cmp(a.o.Time, b.o.Time) : cmp(a.o.Time, b.o.Time) || cmp(a.o.Programme, b.o.Programme)) || cmp(a.o['Spot Type'], b.o['Spot Type']));
  const cre = new Map();
  sel.forEach(o => { const k = o._creativeDetail + '\u0001' + (o['Clock-number'] || ''); const v = cre.get(k) || { name: o._creativeDetail, dtv: o.Creative, clock: o['Clock-number'], tel: o['Tel-No'], ask: o.Ask, cta: o.CTA, n: 0, c15: 0, chs: new Set() }; v.n++; v.c15 += o['Media Cost 15%'] || 0; v.chs.add(o.Channel); cre.set(k, v); });
  const hours = new Array(27).fill(0); sel.forEach(o => { const h = parseInt(String(o.Time || '').slice(0, 2), 10); if (!isNaN(h) && h < 27) hours[h]++; });
  const maxH = Math.max(1, ...hours), maxN = Math.max(1, ...groups.flatMap(v => v.n));
  const hc = n => n === 0 ? 'transparent' : n <= maxN * .34 ? 'var(--h1)' : n <= maxN * .67 ? 'var(--h2)' : 'var(--h3)';
  const dow = ['일', '월', '화', '수', '목', '금', '토'];
  const wd = i => ymd ? new Date(Date.UTC(ymd[0], ymd[1] - 1, i)).getUTCDay() : -1;
  const tot = { n: sel.length, c15: sel.reduce((a, o) => a + (o['Media Cost 15%'] || 0), 0), imp: sel.reduce((a, o) => a + (+o.Impacts || 0), 0), prog: new Set(sel.map(o => o.Programme)).size };
  const fixedW = (all ? 74 : 0) + 72 + 140 + 46 + 36 + 48 + 120 + 52 + (dashShowCost ? 5 * 78 : 0) + 40;
  const availW = Math.max(300, ($('#chDetail').clientWidth || 1200) - 40);
  const fitN = Math.max(7, Math.min(days, Math.floor((availW - fixedW) / 22)));
  const win = dashWin === 'all' ? days : dashWin === 'fit' ? fitN : Math.min(days, dashWin);
  const from = Math.max(1, Math.min(dashFrom, days - win + 1)), to = from + win - 1; dashFrom = from;
  const range = Array.from({ length: win }, (_, i) => from + i);
  const dayW = Math.max(18, Math.min(32, Math.floor((availW - fixedW) / win)));
  const dlab = d => { const w = wd(d); return (ymd ? ymd[1] + '/' : '') + d + (w >= 0 ? '(' + dow[w] + ')' : ''); };
  groups.forEach(v => { v.nr = range.reduce((a, d) => a + v.n[d], 0); });
  const shown = groups.filter(v => v.nr > 0), hidden = groups.length - shown.length;
  const ft = { sub: 0, n: 0, day: {} }; shown.forEach(v => { ft.sub += v.c15 / v.cnt * v.nr; ft.n += v.nr; range.forEach(d => ft.day[d] = (ft.day[d] || 0) + v.n[d]); });
  const cols = [...(all ? [74] : []), 72, 140, 46, 36, 48, 120, 52, ...(dashShowCost ? [78, 78, 78, 78, 78] : []), ...range.map(() => dayW), 40];
  const tabs = [['__all', '전체']].concat(chs.map(c => [c, c]));
  $('#chDetail').innerHTML = `<h2>채널별 프로그램·시간대 편성</h2><p class="lead">채널을 고르면 프로그램, 시간, 형태, 소재, 소재번호(클락넘버)별로 어느 날 몇 번 나가는지 봅니다. 같은 프로그램이라도 소재나 단가가 다르면 줄을 나눕니다.</p>
   <div class="tabs">${tabs.map(t => `<button data-dc="${esc(t[0])}" class="${dashCh === t[0] ? 'on' : ''}">${esc(t[1])}</button>`).join('')}</div>
   <div class="kpis"><div class="kpi"><div>${tot.n.toLocaleString()}</div><span>스팟</span></div><div class="kpi"><div>${tot.prog}</div><span>프로그램</span></div><div class="kpi"><div>${fmt(tot.c15)}</div><span>Media Cost 15%</span></div><div class="kpi"><div>${fmt(tot.imp)}</div><span>Impacts</span></div></div>
   <div class="grid2" style="margin-bottom:16px">
    <div><b style="font-size:13px">소재·소재번호</b><div class="tbl" style="margin-top:6px;max-height:260px"><table><thead><tr><th>소재(상세)</th><th>클락넘버</th><th>전화번호</th><th class="n">Ask</th><th>CTA</th>${all ? '<th>채널</th>' : ''}<th class="n">스팟</th><th class="n">비중</th></tr></thead><tbody>${[...cre.values()].sort((a, b) => b.n - a.n).map(v => `<tr><td title="DTV 납품명: ${esc(v.dtv)}">${esc(v.name)}</td><td>${esc(v.clock || '없음')}</td><td>${esc(v.tel)}</td><td class="n">${fmt(v.ask)}</td><td>${esc(v.cta)}</td>${all ? `<td>${esc([...v.chs].join(', '))}</td>` : ''}<td class="n">${v.n}</td><td class="n">${Math.round(v.n / tot.n * 100)}%</td></tr>`).join('')}</tbody></table></div></div>
    <div><b style="font-size:13px">시간대별 스팟</b><div class="bars" style="height:200px">${hours.slice(5, 27).map((n, i) => `<div style="height:${n / maxH * 100}%" title="${i + 5}시대 ${n}스팟"></div>`).join('')}</div><div class="barlbl">${hours.slice(5, 27).map((n, i) => `<span>${(i + 5) % 3 === 0 ? i + 5 : ''}</span>`).join('')}</div></div>
   </div>
   ${stList.length > 1 ? `<div class="row" style="margin-bottom:8px;gap:6px"><span class="note">송출 채널</span><button class="sm ${!dashSt ? 'pri' : ''}" data-dst="">전체 ${sel0.length}</button>${stList.map(s2 => `<button class="sm ${dashSt === s2 ? 'pri' : ''}" data-dst="${esc(s2)}">${esc(s2)} ${sel0.filter(o => o._station === s2).length}</button>`).join('')}<span class="note">${esc(dashCh)}은 여러 송출 채널을 묶은 그룹입니다</span></div>` : ''}
   <div class="row" style="margin-bottom:8px;gap:8px"><span class="note">정렬</span><button class="sm ${dashSort === 'time' ? 'pri' : ''}" data-ds="time">시간순</button><button class="sm ${dashSort === 'prog' ? 'pri' : ''}" data-ds="prog">프로그램순</button>
    <span class="note" style="margin-left:10px">기간</span>${[['fit', '화면 맞춤'], ['7', '1주'], ['14', '2주'], ['all', '전체']].map(x => `<button class="sm ${String(dashWin) === x[0] ? 'pri' : ''}" data-dr="${x[0]}">${x[1]}</button>`).join('')}
    <button class="sm" data-dx="1" style="margin-left:10px">편성표 xlsx</button>
    <label class="note" style="margin-left:10px"><input type="checkbox" id="dcCost" ${dashShowCost ? 'checked' : ''}> 금액 열 보기</label></div>
   <div class="row" style="margin-bottom:10px;gap:10px;flex-wrap:nowrap"><button class="sm" data-dm="-1" ${from <= 1 ? 'disabled' : ''} aria-label="이전 날짜">◀</button><input type="range" id="drSlide" min="1" max="${Math.max(1, days - win + 1)}" value="${from}" style="flex:1" aria-label="날짜 슬라이드" ${win >= days ? 'disabled' : ''}><button class="sm" data-dm="1" ${to >= days ? 'disabled' : ''} aria-label="다음 날짜">▶</button><b style="min-width:150px;font-size:13px">${dlab(from)} ~ ${dlab(to)}</b><span class="note">${shown.length}줄${hidden ? `, 기간 내 스팟 없는 ${hidden}줄 숨김` : ''}</span></div>

   <div class="tbl" style="max-height:600px;overflow-x:auto"><table class="fx" style="table-layout:fixed;width:100%"><colgroup>${cols.map(w => `<col style="width:${w}px">`).join('')}</colgroup><thead><tr>${all ? '<th>Station</th>' : ''}<th>Tel-No</th><th>Creative</th><th class="n">Ask</th><th class="n">Dur</th><th>Time</th><th>Programme</th><th>Spot Type</th>${dashShowCost ? '<th class="n">Media Cost per Spot</th><th class="n">Media Cost per Spot inc AC</th><th class="n">Sub Media Cost Inc. AC (Gross)</th><th class="n">Net Media-Only Cost (Include VAT)</th><th class="n">Gross Media-Only Cost (Include VAT)</th>' : ''}${range.map(d => { const w = wd(d); return `<th class="d" style="${w === 0 || w === 6 ? 'color:var(--err)' : ''}">${d}<br>${w >= 0 ? dow[w] : ''}</th>`; }).join('')}<th class="n">합계</th></tr></thead><tbody>
   ${shown.map(v => { const ps = v.c15 / v.cnt, sub = ps * v.nr; return `<tr>${all ? `<td title="${esc(v.o.Channel)}">${esc(v.o.Channel)}</td>` : ''}<td>${esc(v.o['Tel-No'])}</td><td title="${esc(v.o._creativeDetail)} / ${esc(v.o['Clock-number'] || '')}">${esc(v.o._creativeDetail)}<div class="note" style="font-size:10.5px;overflow:hidden;text-overflow:ellipsis">${esc(v.o['Clock-number'] || '클락넘버 없음')}</div></td><td class="n">${fmt(v.o.Ask)}</td><td class="n">${esc(v.o.Dur)}</td><td>${esc(v.o.Time)}</td><td title="${esc(v.o.Programme)}${v.o._station ? ' · ' + esc(v.o._station) : ''}">${esc(v.o.Programme)}${stList.length > 1 && !dashSt ? `<div class="note" style="font-size:10.5px">${esc(v.o._station || '')}</div>` : ''}</td><td>${esc(v.o['Spot Type'])}</td>${dashShowCost ? `<td class="n">${fmt(ps * 0.85)}</td><td class="n">${fmt(ps)}</td><td class="n">${fmt(sub)}</td><td class="n">${fmt(sub * 0.85 * 1.1)}</td><td class="n">${fmt(sub * 1.1)}</td>` : ''}${range.map(d => `<td class="d" style="background:${hc(v.n[d])}">${v.n[d] || ''}</td>`).join('')}<td class="n"><b>${v.nr}</b></td></tr>`; }).join('')}
   </tbody><tfoot><tr><td colspan="${all ? 8 : 7}">합계 (${dlab(from)} ~ ${dlab(to)})</td>${dashShowCost ? `<td></td><td></td><td class="n">${fmt(ft.sub)}</td><td class="n">${fmt(ft.sub * 0.85 * 1.1)}</td><td class="n">${fmt(ft.sub * 1.1)}</td>` : ''}${range.map(d => `<td class="d">${ft.day[d] || ''}</td>`).join('')}<td class="n">${ft.n}</td></tr></tfoot></table></div>
   <p class="note" style="margin-top:6px">금액은 선택 기간 기준입니다. Media Cost per Spot = inc AC × 0.85, Sub = inc AC × 기간 내 스팟, Net = Sub × 0.85 × 1.1, Gross = Sub × 1.1 (10월 Spot Schedule 시트에서 확인한 계산식).</p>`;

function spotScheduleWb(rows) {
  // 관찰된 계산식: Sub = 스팟당 inc AC × 스팟 수, Net(VAT 포함) = Sub × 0.85 × 1.1, Gross(VAT 포함) = Sub × 1.1
  const ymd = ymKeyToDate(S.ym); const days = ymd ? new Date(Date.UTC(ymd[0], ymd[1], 0)).getUTCDate() : 31;
  const key = o => [o.Channel, o['Tel-No'], o.Creative, o.Ask, o.Dur, o.Time, o.Programme, o['Spot Type'], Math.round((o['Media Cost 15%'] || 0) * 1e6)].join('\u0001');
  const g = new Map();
  rows.forEach(o => { const k = key(o); const v = g.get(k) || { o, n: new Array(days + 1).fill(0) }; v.n[o.Date.getUTCDate()]++; g.set(k, v); });
  const groups = [...g.values()].sort((a, b) => a.o.Channel.localeCompare(b.o.Channel) || String(a.o['Tel-No']).localeCompare(String(b.o['Tel-No'])) || String(a.o.Creative).localeCompare(String(b.o.Creative)) || String(a.o.Time).localeCompare(String(b.o.Time)));
  const dates = Array.from({ length: days }, (_, i) => ymd ? serial(new Date(Date.UTC(ymd[0], ymd[1] - 1, i + 1))) : i + 1);
  const net = rows.reduce((a, o) => a + (o['Media Cost'] || 0), 0) * 1.1, gross = rows.reduce((a, o) => a + (o['Media Cost 15%'] || 0), 0) * 1.1;
  const aoa = [[null, `Spot Schedule(${ymd ? ymd[0] + '-' + String(ymd[1]).padStart(2, '0') : S.ym}) 초안`], [], [null, 'MEDIA BUDGET (Media Cost Only):'], [null, 'NET', Math.round(net)], [null, 'GROSS', Math.round(gross)], [],
    [null, 'Station', 'Tel-No', 'Creative', 'Ask', 'Dur', 'Time', 'Programme', 'Spot Type', 'Media Cost per Spot', 'Media Cost per Spot inc AC', 'Sub Media Cost\nInc. AC (Gross)', 'Net Media-Only Cost\n(Include VAT)', 'Gross Media-Only Cost\n(Include VAT)', ...dates, '총합계']];
  let lastCh = null, chAgg = null; const flush = () => { if (chAgg) aoa.push([null, null, null, 'Media Net cost', null, null, null, 'Media Gross cost', null, chAgg[0], chAgg[1], chAgg[2], chAgg[2] * 0.85 * 1.1, chAgg[2] * 1.1, ...new Array(days).fill(null), chAgg[3]]); };
  groups.forEach(({ o, n }) => {
    if (o.Channel !== lastCh) { flush(); lastCh = o.Channel; chAgg = [0, 0, 0, 0]; }
    const cnt = n.reduce((a, x) => a + x, 0), c15 = o['Media Cost 15%'] || 0, sub = c15 * cnt;
    chAgg[0] += c15 * 0.85; chAgg[1] += c15; chAgg[2] += sub; chAgg[3] += cnt;
    aoa.push([null, o.Channel, o['Tel-No'], o.Creative, o.Ask, o.Dur, o.Time, o.Programme, o['Spot Type'], c15 * 0.85, c15, sub, sub * 0.85 * 1.1, sub * 1.1, ...n.slice(1).map(x => x || null), cnt]);
  });
  flush();
  aoa.push([null, 'Grand Total', ...new Array(12 + days).fill(null), rows.length]);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  for (let c = 0; c < days; c++) { const a = XLSX.utils.encode_cell({ r: 6, c: 14 + c }); if (ws[a] && ymd) ws[a].z = 'm/d'; }
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Spot Schedule'); return wb;
}
